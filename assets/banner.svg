<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="50%" stop-color="#10172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    
    .bg-grid { opacity: 0.08; stroke: #94a3b8; stroke-width: 1; }
    .pulse-node { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .p1 { animation: floatParticle 6s infinite ease-in-out; }
    .p2 { animation: floatParticle 8s infinite ease-in-out 1s; }
    .p3 { animation: floatParticle 7s infinite ease-in-out 2s; }
    .flow-path { stroke-dasharray: 8 12; animation: flowLine 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic Grid lines -->
  <g class="bg-grid">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- Dynamic Lineage / Metadata Network Background Elements (Low opacity behind text) -->
  <g opacity="0.25">
    <path d="M 100,280 Q 250,100 450,220 T 800,140 T 1100,260" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-path" />
    <path d="M 50,120 Q 300,300 650,100 T 1000,280" fill="none" stroke="#a855f7" stroke-width="2" class="flow-path" />
    
    <!-- Floating Data Nodes -->
    <circle cx="150" cy="100" r="6" fill="#38bdf8" class="p1" />
    <circle cx="350" cy="280" r="8" fill="#818cf8" class="p2" filter="url(#subtleGlow)" />
    <circle cx="850" cy="90" r="7" fill="#c084fc" class="p3" />
    <circle cx="1050" cy="220" r="9" fill="#06b6d4" class="p1" filter="url(#subtleGlow)" />
  </g>

  <!-- Glowing Accent Circles in Corners -->
  <circle cx="950" cy="180" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" class="pulse-node" />
  <circle cx="200" cy="180" r="140" fill="#06b6d4" opacity="0.1" filter="url(#glow)" class="pulse-node" />

  <!-- Foreground Content Container -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
        MLOPS &amp; DATA ENGINE
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome ML Metadata Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="212" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      Curated Ecosystem for Experiment Tracking, Model Lineage &amp; Artifact Governance
    </text>

    <!-- Sub-bullets / Badges inside banner -->
    <g transform="translate(600, 265)">
      <text x="-240" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">🧪 Experiment Tracking</text>
      <circle cx="-140" cy="-4" r="3" fill="#64748b" />
      <text x="-50" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">⛓️ Model Lineage</text>
      <circle cx="45" cy="-4" r="3" fill="#64748b" />
      <text x="140" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">📦 Artifact Versioning</text>
    </g>
  </g>
</svg>
