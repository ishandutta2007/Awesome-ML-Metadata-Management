<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d1a"/><stop offset="50%" stop-color="#10172a"/><stop offset="100%" stop-color="#1e1035"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="nodeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-15px) translateX(10px);opacity:.7}}@keyframes flowLine{0%{stroke-dashoffset:100}}.bg-grid{opacity:.08;stroke:#94a3b8;stroke-width:1}.pulse-node{animation:pulse 4s infinite ease-in-out;transform-origin:center}.p1{animation:floatParticle 6s infinite ease-in-out}.p2{animation:floatParticle 8s infinite ease-in-out 1s}.p3{animation:floatParticle 7s infinite ease-in-out 2s}.flow-path{stroke-dasharray:8 12;animation:flowLine 20s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g class="bg-grid"><path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300"/><path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360"/></g><g opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 100,280 Q 250,100 450,220 T 800,140 T 1100,260" class="flow-path"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 50,120 Q 300,300 650,100 T 1000,280" class="flow-path"/><circle cx="150" cy="100" r="6" fill="#38bdf8" class="p1"/><circle cx="350" cy="280" r="8" fill="#818cf8" class="p2" filter="url(#subtleGlow)"/><circle cx="850" cy="90" r="7" fill="#c084fc" class="p3"/><circle cx="1050" cy="220" r="9" fill="#06b6d4" class="p1" filter="url(#subtleGlow)"/></g><circle cx="950" cy="180" r="180" fill="#6366f1" class="pulse-node" filter="url(#glow)" opacity=".12"/><circle cx="200" cy="180" r="140" fill="#06b6d4" class="pulse-node" filter="url(#glow)" opacity=".1"/><g text-anchor="middle"><g transform="translate(600, 72)"><rect width="280" height="34" x="-140" y="-18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity=".9" rx="17"/><text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MLOPS &amp; DATA ENGINE</text></g><text x="600" y="160" fill="url(#titleGrad)" filter="url(#subtleGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-.5">Awesome ML Metadata Management</text><text x="600" y="212" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing=".2">Curated Ecosystem for Experiment Tracking, Model Lineage &amp; Artifact Governance</text><g transform="translate(600, 265)"><text x="-240" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">🧪 Experiment Tracking</text><circle cx="-140" cy="-4" r="3" fill="#64748b"/><text x="-50" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">⛓️ Model Lineage</text><circle cx="45" cy="-4" r="3" fill="#64748b"/><text x="140" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">📦 Artifact Versioning</text></g></g></svg>